name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore & Build (all projects incl. MAUI Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Android-only MAUI builds on Linux; the runner already ships a JDK and the Android SDK.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore Tobot.slnx

      - name: Build solution
        run: dotnet build Tobot.slnx --no-restore --configuration Release

      # The solution excludes the MAUI project from its build, so build it explicitly.
      - name: Build MAUI (Android)
        run: dotnet build src/Tobot.Maui -f net10.0-android --configuration Release
