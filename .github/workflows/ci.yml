name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore & Build (Shared, Device, Host, Client, CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Tobot.slnx

      - name: Build
        run: dotnet build Tobot.slnx --no-restore --configuration Release

  maui:
    name: Build MAUI (Mac Catalyst)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      # The runner's Xcode may be newer than the one the workload pins; the compile itself is what we verify.
      - name: Build
        run: dotnet build src/Tobot.Maui -f net10.0-maccatalyst -r maccatalyst-arm64 -c Release -p:ValidateXcodeVersion=false
